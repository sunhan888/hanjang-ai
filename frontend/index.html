<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#EEF1F5">
<meta name="description" content="과태료 고지서 사진 한 장으로 마감일과 낼 돈, 할 일을 쉬운 말로 알려 드려요.">
<title>한장해결 · 과태료 고지서 도우미</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- 글꼴은 늦게 와도 화면을 막지 않게 (느린 모바일 데이터 대비). 못 받으면 기본 고딕으로 보인다 -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" media="print" onload="this.media='all'">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="app" class="app"><main class="screen"><p class="lead">한장해결을 여는 중이에요…</p></main></div>
<!-- 카메라(바로 촬영)와 앨범(고르기)은 같은 처리로 이어진다 -->
<input id="file-camera" type="file" accept="image/*" capture="environment" hidden>
<input id="file-album" type="file" accept="image/*" hidden>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<noscript><p style="padding:24px;font-size:20px">자바스크립트를 켜야 쓸 수 있어요.</p></noscript>
<script type="module" src="js/app.js"></script>
</body>
</html>
